#========================================
# Test profile settings (IT tests)
# Booted by @WireMockAppTestSuite and OpenApiSpecificationIT under the
# "it" profile. The MockAzureAdTokenServiceConfiguration is also active
# on this profile, so MSAL/Azure calls are stubbed; only the Graph SDK
# is exercised end-to-end (against WireMock).
#========================================
spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:mariadb:10.6:///
  flyway:
    enabled: true
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: validate

azure:
  ad:
    "2281":
      user: it-user
      clientId: it-client-id
      clientSecret: it-secret
      authorityUrl: http://localhost:${wiremock.server.port}/azure
      redirectUri: http://localhost/callback
      scopes: https://graph.microsoft.com/.default
      loginUrl: http://localhost:${wiremock.server.port}/azure/login

graph:
  base-url: http://localhost:${wiremock.server.port}/graph

logging:
  level:
    root: WARN
