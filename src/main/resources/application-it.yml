#========================================
# Test profile settings (IT tests)
# Booted by @WireMockAppTestSuite and OpenApiSpecificationIT under the
# "it" profile. teams.graph-base-url redirects Graph calls to WireMock;
# the Azure credentials below are throwaway values so the
# ClientSecretCredential builds, but no real OAuth call is made when the
# Graph base URL is overridden.
#========================================
azure:
  ad:
    "2281":
      tenantId: it-tenant
      clientId: it-client-id
      clientSecret: it-secret

teams:
  scope: https://graph.microsoft.com/.default
  graph-base-url: http://localhost:${wiremock.server.port}/graph
  default-target-url: https://status.example.invalid
  activity-type: systemDefault
  topic-label: IT-Notification
  static-access-token: it-fake-bearer-token

logging:
  level:
    root: WARN
