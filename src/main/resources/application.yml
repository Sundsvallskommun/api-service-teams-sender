#========================================
# General settings
#========================================
logging:
  level:
    root: INFO

openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'

spring:
  application:
    name: teamssender

#----------------------------------------
# Per-municipality Azure AD app credentials (OAuth2 client credentials).
# The app must have the TeamsActivity.Send application permission with
# tenant-admin consent.
#----------------------------------------
azure:
  ad:
    "2281":
      tenantId: ${AZURE_TENANT_ID}
      clientId: ${AZURE_CLIENT_ID}
      clientSecret: ${AZURE_CLIENT_SECRET}

#----------------------------------------
# Service-wide Teams notification settings.
# - scope: Graph application scope (almost always .default).
# - default-target-url: clickable target for notifications when a request
#   doesn't supply targetUrl.
# - activity-type: must match an activity type registered in the tenant's
#   Teams app manifest. "systemDefault" works in many tenants; coordinate
#   with the Azure admin (see TODO.md).
# - topic-label: short title shown above the previewText in the activity
#   feed entry.
#----------------------------------------
teams:
  scope: https://graph.microsoft.com/.default
  default-target-url: ${TEAMS_DEFAULT_TARGET_URL:https://www.sundsvall.se}
  activity-type: ${TEAMS_ACTIVITY_TYPE:systemDefault}
  topic-label: ${TEAMS_TOPIC_LABEL:Notification}
